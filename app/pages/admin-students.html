<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人员管理 · 教务管理员</title>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/sandbox.css">
</head>
<body class="role-admin" data-role="admin" data-nav-done="1">

<div id="topbarSlot"></div>

<main class="wrap wide">

  <div class="pg-head">
    <span class="eyebrow">星禾云课堂</span>
    <h1>人员管理</h1>
    <p class="sub">管理导师与学员：添加人员、编辑学员资料、调整带教老师、重置密码与换工号。</p>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="sub">导师（<b id="mentorCount">0</b>）—— 先有导师，学员才能挂靠。</div>
      <button class="btn sm" onclick="openAddPerson('mentor')">＋ 添加导师</button>
    </div>
    <div class="tblwrap" style="margin-top:12px">
      <table>
        <thead><tr>
          <th>工号</th><th>姓名</th><th>校区</th><th>职称</th><th>带教学徒</th><th>操作</th>
        </tr></thead>
        <tbody id="mentorRows"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="sub">学员（<b id="stuCount">0</b>）—— 全部在训名单。</div>
      <button class="btn sm" onclick="openAddPerson('student')">＋ 添加学员</button>
    </div>
    <div class="tblwrap" style="margin-top:12px">
      <table>
        <thead><tr>
          <th>工号</th><th>姓名</th><th>校区</th><th>导师</th><th>带教计划</th><th>当前关卡</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="stuRows"></tbody>
      </table>
    </div>
  </div>

  <details class="fold">
    <summary>改工号会迁移哪些记录？</summary>
    <div class="fold-body">
      换工号会把该学员在用户档案、学员档案、学习进度、同频确认、任务卡提交与审核、闯关记录、转正登记等
      全部历史记录一并迁移到新工号；迁移前自动快照，可在数据恢复中回滚。
    </div>
  </details>

</main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script src="../assets/app.js"></script>
<script src="../assets/mock-data.js"></script>
<script src="../assets/mock-api.js"></script>
<script src="../assets/mock-api-live.js"></script>
<script src="../assets/ui.js"></script>
<script>
/* 人员管理（原「学员管理」，2026-10-15 改版）：分「导师 / 学员」两区块。
   学员保留第三轮模块 A 全部能力（A1 编辑 / A3 改带教 / A4 重置密码 / A5 换工号）；
   新增：openAddPerson('mentor'|'student') 添加导师/学员（复用 mockAddUser → adminUserUpsert 同一接线）。
   导师行提供「重置密码」（复用 openResetPwReal）。
   注册 window.__rerender 重绘钩子（沿用 P0-3 约定），真实数据异步到达后重绘。 */
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof needsLoginGate==='function'&&needsLoginGate())return;
  document.getElementById('topbarSlot').innerHTML = UI.topbarHTML('admin','admin-students.html');
  initNav();
  if(typeof UI.refreshTodoDot==='function') UI.refreshTodoDot(MOCKAPI.S.wid);
  window.__rerender = render;
  render();
});

function render(){
  if(typeof needsLoginGate==='function'&&needsLoginGate())return;
  const n = MOCK.DB.levels.length;

  /* 导师表：校区取 users 档案（mentors.json 只有 id/name/title）；
     带教学徒数按 trainees.mentorId 实时统计，与「我的带教」同口径。 */
  const mentors = MOCK.DB.mentors || [];
  document.getElementById('mentorCount').textContent = mentors.length;
  document.getElementById('mentorRows').innerHTML = mentors.map(m=>{
    const u = MOCK.userOf(m.id) || {};
    const cnt = (MOCK.DB.trainees||[]).filter(t=>t.mentorId===m.id).length;
    const wid = UI.esc(m.id);
    return `<tr>
      <td><b>${wid}</b></td>
      <td>${UI.esc(m.name)}</td>
      <td>${UI.esc(u.dept||'—')}</td>
      <td>${UI.esc(m.title||u.title||'—')}</td>
      <td>${cnt} 人</td>
      <td>
        <button class="btn ghost sm" onclick="openResetPwReal('${wid}')">重置密码</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="sub">暂无导师，点右上「＋ 添加导师」创建。</td></tr>';

  /* 学员表：保持既有 7 列与操作不变。 */
  const list = MOCK.DB.trainees || [];
  document.getElementById('stuCount').textContent = list.length;
  document.getElementById('stuRows').innerHTML = list.map(t=>{
    const cur = MOCK.currentLevelOf(t.id);
    const curTxt = cur.no > n ? '已通关' : ('第 '+cur.no+' 关 · '+cur.title);
    const planName = (MOCK.planOf(t.planId)||{}).name || '—';
    const wid = UI.esc(t.id);
    return `<tr>
      <td><b>${wid}</b></td>
      <td>${UI.esc(t.name)}</td>
      <td>${UI.esc(t.dept||'—')}</td>
      <td>${UI.esc((MOCK.mentorOf(t.mentorId)||{}).name||'—')}</td>
      <td>${UI.esc(planName)}</td>
      <td>${UI.esc(curTxt)}</td>
      <td>${MOCK.DB.signoffs[t.id]?'<span class="tag ok">已出师</span>':'<span class="tag">培养中</span>'}</td>
      <td>
        <button class="btn ghost sm" onclick="openEditStudent('${wid}')">编辑</button>
        <button class="btn ghost sm" onclick="openChangeMentor('${wid}')">改导师</button>
        <button class="btn ghost sm" onclick="openResetPwReal('${wid}')">重置密码</button>
        <button class="btn ghost sm" onclick="openMigrateWid('${wid}')">换工号</button>
      </td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
