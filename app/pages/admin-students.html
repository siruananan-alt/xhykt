<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学员管理 · 教务管理员</title>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/sandbox.css">
</head>
<body class="role-admin" data-role="admin" data-nav-done="1">

<div id="topbarSlot"></div>

<main class="wrap wide">

  <div class="pg-head">
    <span class="eyebrow">星禾云课堂</span>
    <h1>学员管理</h1>
    <p class="sub">编辑学员资料、调整带教老师、重置密码与换工号。</p>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="sub">共 <b id="stuCount">0</b> 名在训学员。</div>
    </div>
    <div class="tblwrap" style="margin-top:12px">
      <table>
        <thead><tr>
          <th>工号</th><th>姓名</th><th>校区</th><th>导师</th><th>带教计划</th><th>当前关卡</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="stuRows"></tbody>
      </table>
    </div>
  </div>

  <details class="fold">
    <summary>改工号会迁移哪些记录？</summary>
    <div class="fold-body">
      换工号会把该学员在用户档案、学员档案、学习进度、同频确认、任务卡提交与审核、闯关记录、转正登记等
      全部历史记录一并迁移到新工号；迁移前自动快照，可在数据恢复中回滚。
    </div>
  </details>

</main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script src="../assets/app.js"></script>
<script src="../assets/mock-data.js"></script>
<script src="../assets/mock-api.js"></script>
<script src="../assets/mock-api-live.js"></script>
<script src="../assets/ui.js"></script>
<script>
/* 学员管理：基线 viewAdminStudents（只读 7 列）
   【2026-10-09 第三轮·模块 A】改为可管理：
     A1 编辑资料 / A3 改带教老师 / A4 重置密码 / A5 换工号。
   注册 window.__rerender 重绘钩子（沿用 P0-3 约定），真实数据异步到达后重绘。 */
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof needsLoginGate==='function'&&needsLoginGate())return;
  document.getElementById('topbarSlot').innerHTML = UI.topbarHTML('admin','admin-students.html');
  initNav();
  if(typeof UI.refreshTodoDot==='function') UI.refreshTodoDot(MOCKAPI.S.wid);
  window.__rerender = render;
  render();
});

function render(){
  if(typeof needsLoginGate==='function'&&needsLoginGate())return;
  const n = MOCK.DB.levels.length;
  const list = MOCK.DB.trainees || [];
  document.getElementById('stuCount').textContent = list.length;
  document.getElementById('stuRows').innerHTML = list.map(t=>{
    const cur = MOCK.currentLevelOf(t.id);
    const curTxt = cur.no > n ? '已通关' : ('第 '+cur.no+' 关 · '+cur.title);
    const planName = (MOCK.planOf(t.planId)||{}).name || '—';
    const wid = UI.esc(t.id);
    return `<tr>
      <td><b>${wid}</b></td>
      <td>${UI.esc(t.name)}</td>
      <td>${UI.esc(t.dept||'—')}</td>
      <td>${UI.esc((MOCK.mentorOf(t.mentorId)||{}).name||'—')}</td>
      <td>${UI.esc(planName)}</td>
      <td>${UI.esc(curTxt)}</td>
      <td>${MOCK.DB.signoffs[t.id]?'<span class="tag ok">已出师</span>':'<span class="tag">培养中</span>'}</td>
      <td>
        <button class="btn ghost sm" onclick="openEditStudent('${wid}')">编辑</button>
        <button class="btn ghost sm" onclick="openChangeMentor('${wid}')">改导师</button>
        <button class="btn ghost sm" onclick="openResetPwReal('${wid}')">重置密码</button>
        <button class="btn ghost sm" onclick="openMigrateWid('${wid}')">换工号</button>
      </td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
